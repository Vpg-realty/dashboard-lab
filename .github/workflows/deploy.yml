name: Deploy lab

# Test copy of the live dashboard. Reads the live site's published data
# (no GHL pull, no secrets) and publishes to /dashboard-lab/.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Once a day, to pick up roster changes from the live subaccounts.json.
    - cron: '17 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lab-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Use the live roster
        run: curl -fsSL --retry 3 -o subaccounts.json https://raw.githubusercontent.com/vpg-realty/dashboard/main/subaccounts.json

      - name: Build static site
        env:
          VITE_BASE: /dashboard-lab/
          VITE_USE_LIVE: '1'
          VITE_DATA_BASE: /dashboard/
          VITE_LAB: '1'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
